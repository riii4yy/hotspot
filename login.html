<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>Hotspot Riii4yy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#5c1a2b;
    --wine-deep:#3d0f1c;
    --gold:#c9a24b;
    --gold-light:#e6c877;
    --ivory:#f6efe2;
    --parchment:#efe4cf;
    --ink:#2c1810;
    --error:#8a2e2e;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{
    color-scheme: light;
  }

  html,body{
    height:100%;
    font-family:'Cormorant Garamond', serif;
    color:var(--ink);
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(ellipse at top left, rgba(230,200,119,0.10), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(230,200,119,0.08), transparent 55%),
      linear-gradient(160deg, var(--wine-deep) 0%, var(--wine) 55%, var(--wine-deep) 100%);
    overflow-x:hidden;
  }

  /* subtle ornamental wifi-signal watermark in the background */
  .bg-signal{
    position:fixed;
    inset:0;
    z-index:0;
    opacity:0.06;
    background-repeat:no-repeat;
    background-position:center;
    background-size:min(900px, 140vw);
    pointer-events:none;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg, var(--ivory), var(--parchment));
    border:1px solid var(--gold);
    border-radius:6px;
    box-shadow:
      0 0 0 1px rgba(201,162,75,0.35),
      0 30px 60px rgba(0,0,0,0.45);
    padding:40px 34px 30px;
    text-align:center;
    overflow:hidden;
  }

  /* partikel kelopak mawar melayang di background */
  .petals{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:-5%;
    opacity:0;
    animation-name:fall;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  .petal svg{ width:100%; height:100%; display:block; }
  @keyframes fall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
    8%{ opacity:0.5; }
    50%{ transform:translate(18px, 55vh) rotate(160deg); opacity:0.4; }
    92%{ opacity:0.22; }
    100%{ transform:translate(-14px, 112vh) rotate(320deg); opacity:0; }
  }

  .signal-icon{
    width:52px;
    height:52px;
    margin:0 auto 14px;
    display:block;
  }

  .signal-icon path{
    stroke:var(--gold);
    fill:none;
    stroke-width:2.2;
    stroke-linecap:round;
  }
  .signal-icon circle{
    fill:var(--wine);
  }

  .brand{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.5px;
    color:var(--wine);
    line-height:1.2;
  }

  .divider{
    width:64px;
    height:1px;
    background:var(--gold);
    margin:14px auto 16px;
  }

  .welcome{
    font-size:18px;
    line-height:1.5;
    color:var(--ink);
  }
  .welcome b{
    color:var(--wine);
    font-weight:600;
  }

  form{
    margin-top:26px;
    text-align:left;
  }

  .field{
    margin-bottom:18px;
  }

  .field label{
    display:block;
    font-size:15px;
    letter-spacing:0.3px;
    color:var(--wine);
    margin-bottom:6px;
  }

  .field-input{
    position:relative;
  }

  .field-input input{
    width:100%;
    padding:11px 14px;
    font-family:'Cormorant Garamond', serif;
    font-size:17px;
    border:1px solid #c9b892;
    border-radius:4px;
    background:#fffdf8;
    color:var(--ink);
    outline:none;
    color-scheme: light;
    -webkit-text-fill-color:var(--ink);
    caret-color:var(--ink);
    transition:border-color .2s, box-shadow .2s;
  }

  .field-input input::placeholder{
    color:#a08f6a;
    opacity:1;
  }

  .field-input input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(201,162,75,0.18);
  }

  /* cegah autofill browser memaksa warna gelap di HP */
  .field-input input:-webkit-autofill,
  .field-input input:-webkit-autofill:hover,
  .field-input input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--ink);
    -webkit-box-shadow:0 0 0 1000px #fffdf8 inset;
    box-shadow:0 0 0 1000px #fffdf8 inset;
    caret-color:var(--ink);
    transition:background-color 9999s ease-in-out 0s;
  }

  .field-input input#password{
    padding-right:44px;
  }

  .toggle-pass{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    padding:4px;
    line-height:0;
  }

  .toggle-pass svg{
    width:20px;
    height:20px;
    stroke:var(--wine);
    fill:none;
    stroke-width:1.6;
  }

  .btn-login{
    width:100%;
    margin-top:8px;
    padding:12px;
    font-family:'Playfair Display', serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.6px;
    color:var(--ivory);
    background:linear-gradient(180deg, #b98f3a, var(--wine));
    border:1px solid var(--gold);
    border-radius:4px;
    cursor:pointer;
    transition:filter .2s, transform .1s;
  }

  .btn-login:hover{ filter:brightness(1.08); }
  .btn-login:active{ transform:translateY(1px); }

  .error-box{
    margin-top:16px;
    padding:9px 12px;
    background:rgba(138,46,46,0.08);
    border:1px solid var(--error);
    border-radius:4px;
    color:var(--error);
    font-size:15px;
  }

  footer{
    margin-top:26px;
    font-size:13px;
    letter-spacing:0.4px;
    color:#8a7550;
  }

  footer span{
    color:var(--wine);
    font-weight:600;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:14px;
  }

  .socials a{
    display:flex;
    align-items:center;
    gap:6px;
    color:#8a7550;
    text-decoration:none;
    font-size:12.5px;
    transition:color .2s;
  }

  .socials a:hover{ color:var(--wine); }

  .socials svg{
    width:18px;
    height:18px;
    fill:var(--gold);
  }

  @media (max-width:420px){
    .card{ padding:32px 22px 24px; }
    .brand{ font-size:24px; }
  }
</style>
</head>
<body>

<div class="bg-signal" style="background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><g fill=%22none%22 stroke=%22%23e6c877%22 stroke-width=%222%22 stroke-linecap=%22round%22><path d=%22M30 120 a100 100 0 0 1 140 0%22/><path d=%22M55 140 a65 65 0 0 1 90 0%22/><path d=%22M80 160 a30 30 0 0 1 40 0%22/></g><circle cx=%22100%22 cy=%22178%22 r=%226%22 fill=%22%23e6c877%22/></svg>')"></div>

<!-- kelopak mawar melayang -->
<div class="petals" id="petals"></div>

<div class="card">

  <svg class="signal-icon" viewBox="0 0 64 64">
    <path d="M8 26 C22 10 42 10 56 26"/>
    <path d="M18 34 C27 24 37 24 46 34"/>
    <path d="M27 42 C31 38 33 38 37 42"/>
    <circle cx="32" cy="50" r="3.4"/>
  </svg>

  <div class="brand">Hotspot Riii4yy</div>
  <div class="divider"></div>
  <div class="welcome">
    Selamat datang di<br>
    <b>SMK PGRI BRATI</b>
  </div>

  <form name="sendin" action="$(link-login-only)" method="post" onsubmit="return doLogin()">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">

    <div class="field">
      <label for="username">Username</label>
      <div class="field-input">
        <input type="text" name="username" id="username" placeholder="Masukkan username" autocomplete="off" autocapitalize="off" required>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="field-input">
        <input type="password" id="password" placeholder="Masukkan password" autocomplete="off" required>
        <input type="hidden" name="password" id="password-hidden">
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan password">
          <svg id="eyeIcon" viewBox="0 0 24 24">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-login">Login</button>

    $(if error)
    <div class="error-box">$(error)</div>
    $(endif)
  </form>

  <div class="socials">
    <a href="https://instagram.com/ridwanchiell" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.07 1.2.06 2 .25 2.4.42.6.24 1 .53 1.5 1s.76.9 1 1.5c.17.4.36 1.2.42 2.4.06 1.3.07 1.7.07 4.9s0 3.6-.07 4.9c-.06 1.2-.25 2-.42 2.4-.24.6-.53 1-1 1.5s-.9.76-1.5 1c-.4.17-1.2.36-2.4.42-1.3.06-1.7.07-4.9.07s-3.6 0-4.9-.07c-1.2-.06-2-.25-2.4-.42-.6-.24-1-.53-1.5-1s-.76-.9-1-1.5c-.17-.4-.36-1.2-.42-2.4C2.21 15.6 2.2 15.2 2.2 12s0-3.6.07-4.9c.06-1.2.25-2 .42-2.4.24-.6.53-1 1-1.5s.9-.76 1.5-1c.4-.17 1.2-.36 2.4-.42C8.4 2.21 8.8 2.2 12 2.2zm0 1.8c-3.15 0-3.52 0-4.76.07-1 .05-1.5.2-1.86.34-.47.18-.8.4-1.15.75s-.57.68-.75 1.15c-.14.36-.29.86-.34 1.86C3.02 8.48 3 8.85 3 12s0 3.52.07 4.76c.05 1 .2 1.5.34 1.86.18.47.4.8.75 1.15s.68.57 1.15.75c.36.14.86.29 1.86.34 1.24.06 1.61.07 4.76.07s3.52 0 4.76-.07c1-.05 1.5-.2 1.86-.34.47-.18.8-.4 1.15-.75s.57-.68.75-1.15c.14-.36.29-.86.34-1.86.06-1.24.07-1.61.07-4.76s0-3.52-.07-4.76c-.05-1-.2-1.5-.34-1.86-.18-.47-.4-.8-.75-1.15s-.68-.57-1.15-.75c-.36-.14-.86-.29-1.86-.34C15.52 4 15.15 4 12 4zm0 3.4a4.6 4.6 0 1 1 0 9.2 4.6 4.6 0 0 1 0-9.2zm0 1.8a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6zm5.85-2c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1z"/></svg>
      ridwanchiell
    </a>
    <a href="https://tiktok.com/@riii4yy" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M16.6 2h-3.2v13.6a3 3 0 1 1-2.1-2.86V9.5a6 6 0 1 0 5.3 5.96V9.15a7.4 7.4 0 0 0 4.4 1.45V7.4a4.2 4.2 0 0 1-4.4-4.2V2z"/></svg>
      riii4yy
    </a>
  </div>

  <footer>Powered By <span>Ridwan.serkom</span></footer>
</div>

<script>
  /* generate partikel kelopak mawar melayang */
  (function(){
    var container = document.getElementById('petals');
    var petalPath = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2 C18 6 18 14 12 20 C6 14 6 6 12 2 Z" fill="%23e6c877"/></svg>';
    var n = 18;
    for(var i=0;i<n;i++){
      var p = document.createElement('div');
      p.className = 'petal';
      var size = 14 + Math.random()*16;
      var left = Math.random()*100;
      var duration = 14 + Math.random()*12;
      var delay = Math.random()*-24;
      p.style.width = size+'px';
      p.style.height = size+'px';
      p.style.left = left+'vw';
      p.style.animationDuration = duration+'s';
      p.style.animationDelay = delay+'s';
      p.innerHTML = petalPath.replace('%23', '#');
      container.appendChild(p);
    }
  })();
</script>

<script>
  var toggle = document.getElementById('togglePass');
  var pass = document.getElementById('password');
  var icon = document.getElementById('eyeIcon');

  var eyeOpen = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
  var eyeClosed = '<path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/><path d="M6.7 6.7C4 8.3 2 12 2 12s4 7 11 7c1.6 0 3-.3 4.2-.8"/><path d="M17.4 17.4C19.7 15.9 22 12 22 12s-1.6-2.8-4.4-4.8"/>';

  toggle.addEventListener('click', function(){
    if(pass.type === 'password'){
      pass.type = 'text';
      icon.innerHTML = eyeClosed;
      toggle.setAttribute('aria-label','Sembunyikan password');
    } else {
      pass.type = 'password';
      icon.innerHTML = eyeOpen;
      toggle.setAttribute('aria-label','Tampilkan password');
    }
  });
</script>

<!-- md5.js bawaan Mikrotik: file ini SUDAH ADA di folder Files > hotspot router kamu,
     dipakai bareng-bareng oleh login.html versi default juga. Jangan dihapus. -->
<script type="text/javascript" src="md5.js"></script>
<script language="javascript">
  function doLogin(){
    var form = document.forms['sendin'];
    var plain = document.getElementById('password').value;
    if (form.username.value === ""){ form.username.focus(); return false; }
    if (plain === "" && "$(chap-id)" === ""){ document.getElementById('password').focus(); return false; }
    if ("$(chap-id)" !== ""){
      document.getElementById('password-hidden').value = hexMD5("$(chap-id)" + plain + "$(chap-challenge)");
    } else {
      document.getElementById('password-hidden').value = plain;
    }
    return true;
  }
</script>

</body>
</html>
